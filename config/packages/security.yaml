security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\UserEntity
                property: phone

    firewalls:
        admin:
            pattern: ^/admin
            stateless: false
            form_login:
                login_path: admin_login
                check_path: admin_login
                enable_csrf: true
                default_target_path: /admin
                csrf_token_id: authenticate
                username_parameter: phone
                password_parameter: password
            logout:
                path: admin_logout
                target: /
        auth:
            pattern: ^/auth
            stateless: true
            security: false
        swagger_ui:
            pattern: ^/api/doc
            stateless: true
            security: false

        swagger_json:
            pattern: ^/api/doc.json
            stateless: true
            security: false
        api:
            pattern: ^/api
            provider: app_user_provider
            stateless: true
            custom_authenticator: 'App\Security\JwtAuthenticator'
    access_control:
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: PUBLIC_ACCESS }
        - { path:  ^/api/doc, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path:  ^/api/doc.json, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/auth, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: ROLE_USER }
when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In test however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
