name: CI Pipeline

on:
    push:
        branches: [ "master" ]
    pull_request:
        branches: [ "master" ]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Install Docker Compose
                run: |
                    sudo apt-get update
                    sudo apt-get install -y curl
                    sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
                    sudo chmod +x /usr/local/bin/docker-compose

            -   name: Load .env.test variables into GitHub Environment
                run: |
                    cat .env.test >> $GITHUB_ENV

            -   name: Use test env
                run: cp .env.test .env

            -   name: Start services
                run: docker-compose up -d --build

            -   name: Install Composer dependencies (in container)
                run: docker-compose exec -T --user root php bash -lc "git config --global --add safe.directory /var/www/html && cd /var/www/html && composer install --no-interaction --prefer-dist --optimize-autoloader"
            -   name: Fix permissions for tests
                run: |
                    docker-compose exec -T --user root php bash -lc "
                      mkdir -p var/cache/test var/log &&
                      chown -R www-data:www-data /var/www/html &&
                      find var -type d -exec chmod 775 {} \; &&
                      find var -type f -exec chmod 664 {} \;
                    "

            -   name: Prepare test database
                run: docker-compose exec -T --user www-data php bash -lc "cd /var/www/html && rm -f var/test.db && MESSENGER_TRANSPORT_DSN='sync://' APP_ENV=test APP_DEBUG=0 DATABASE_URL='sqlite:///%kernel.project_dir%/var/test.db' php bin/console doctrine:schema:create --env=test"

            -   name: Run tests
                run: docker-compose exec -T --user www-data php bash -lc "composer run ci:tests"

            -   name: Stop and remove containers (test)
                if: always()
                run: docker-compose down -v


    code_quality:
        needs: test
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install Docker Compose
                run: |
                    sudo apt-get update
                    sudo apt-get install -y curl
                    sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
                    sudo chmod +x /usr/local/bin/docker-compose

            -   name: Load .env.test variables into GitHub Environment
                run: |
                    cat .env.test >> $GITHUB_ENV

            -   name: Use test env
                run: cp .env.test .env
            -   name: Install Docker Compose (robust, Compose v2 CLI plugin + shim)
                run: |
                    set -euo pipefail

                    # удалить старые вариации, если есть
                    sudo rm -f /usr/local/bin/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose || true

                    # создать директорию для cli plugins
                    sudo mkdir -p /usr/local/lib/docker/cli-plugins

                    # скачиваем бинарник; --fail сделает curl неудачным при HTTP >=400 (не сохранит HTML)
                    ARCH=$(uname -m)
                    OS=$(uname -s)
                    URL="https://github.com/docker/compose/releases/latest/download/docker-compose-${OS}-${ARCH}"
                    echo "Downloading: $URL"

                    sudo curl -sSL --fail "$URL" -o /usr/local/lib/docker/cli-plugins/docker-compose

                    # проверка: если curl вернул ошибку — блок упадёт; если файл текстовый — покажем первые строки для диагностики
                    if ! sudo file /usr/local/lib/docker/cli-plugins/docker-compose | grep -q 'executable'; then
                      echo "Downloaded file is not executable binary — showing head for debug:"
                      sudo head -n 40 /usr/local/lib/docker/cli-plugins/docker-compose || true
                      echo "Failing because downloaded file is not binary"
                      exit 1
                    fi

                    sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

                    # optional: make old-style command available
                    sudo ln -sf /usr/local/lib/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose

                    echo "Installed versions:"
                    docker --version || true
                    docker compose version || true
                    /usr/local/bin/docker-compose --version || true

            -   name: Build and start docker-compose services
                run: docker-compose up -d --build

            -   name: Mark repo safe for git (system)
                run: docker-compose exec -T --user root php bash -lc "git config --global --add safe.directory /var/www/html && composer install --no-interaction --prefer-dist --optimize-autoloader && git config --system --add safe.directory /var/www/html || true"

            -   name: Run PHPCS
                run: docker-compose exec -T --user www-data php bash -lc "composer run cs:check"

            -   name: Ensure Symfony cache & dump container XML
                run: |
                    docker-compose exec -T --user root php bash -lc "\
                      cd /var/www/html && \
                      export APP_ENV=dev APP_DEBUG=1 && \
                      php bin/console cache:clear --no-warmup || true && \
                      php bin/console lint:container || true \
                    "

            -   name: Run Psalm
                run: docker-compose exec -T --user root php bash -lc "cd /var/www/html && composer run psalm"

            -   name: Stop and remove containers (code_quality)
                if: always()
                run: docker-compose down -v
